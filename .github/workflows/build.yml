name: Build Unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project YoutaoAdmin.xcodeproj -scheme YoutaoAdmin \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/YoutaoAdmin.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry YoutaoAdmin.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoutaoAdmin-unsigned
          path: YoutaoAdmin.ipa
          retention-days: 7

      # 把 IPA 推回 dist 分支，便于本地无 gh CLI 时用 git 凭据直接取包
      - name: Publish IPA to dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/dist
          cp YoutaoAdmin.ipa /tmp/dist/YoutaoAdmin.ipa
          cd /tmp/dist
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YoutaoAdmin.ipa
          git commit -qm "build: YoutaoAdmin.ipa for $GITHUB_SHA"
          git push -f "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" dist
