name: Build Unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project YoutaoAdmin.xcodeproj -scheme YoutaoAdmin \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/YoutaoAdmin.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry YoutaoAdmin.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoutaoAdmin-unsigned
          path: YoutaoAdmin.ipa
          retention-days: 7

      # 把 IPA 推回 dist 分支，便于本地无 gh CLI 时用 git 凭据直接取包
      - name: Publish IPA to dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/dist
          cp YoutaoAdmin.ipa /tmp/dist/YoutaoAdmin.ipa
          cd /tmp/dist
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YoutaoAdmin.ipa
          git commit -qm "build: YoutaoAdmin.ipa for $GITHUB_SHA"
          git push -f "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" dist

      # 无论成功失败都把编译日志推到 logs 分支：Actions 的 logs 接口需要认证，本机拿不到
      - name: Publish build log to logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/logs
          if [ -f build.log ]; then cp build.log /tmp/logs/build.log; else echo "no build.log" > /tmp/logs/build.log; fi
          echo "status=${{ job.status }} sha=$GITHUB_SHA" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q
          git checkout -q -b logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "log $GITHUB_SHA ${{ job.status }}"
          git push -f "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" logs
