name: Build Unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project YoutaoAdmin.xcodeproj -scheme YoutaoAdmin \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/YoutaoAdmin.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry YoutaoAdmin.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoutaoAdmin-unsigned
          path: YoutaoAdmin.ipa
          retention-days: 7
